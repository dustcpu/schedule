[package]
name = "paike-assistant"
version = "0.1.4"
edition = "2021"
description = "排课助手 v0.1.4"

[[bin]]
name = "paike-assistant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
